<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohd Umar × Salman Enterprises — Staff, Shops &amp; Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; }
      .print-sheet { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased">
  <div id="app"></div>

  <script>
    const STORAGE_KEY = 'mohd_umar_salman_enterprises_erp_v2';
    const ADMIN_TABS = ['users', 'shops', 'location'];
    const ALL_TABS = ['attendance', 'report', ...ADMIN_TABS];

    // Report filters live only in this browser (not synced to the cloud)
    const ui = { from: '', to: '' };

    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function inr(n) {
      return '₹' + Number(n || 0).toLocaleString('en-IN');
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function defaultState() {
      return {
        brandName: 'Mohd Umar × Salman Enterprises',
        tagline: 'Staff Attendance, Shop Visits, Sales & Collection',
        geofenceRadiusMeters: 50,
        baseOffice: {
          name: 'Base Office — Salman Enterprises',
          address: 'Prayagraj, Uttar Pradesh',
          lat: 25.4358,
          lng: 81.8463
        },
        users: [
          {
            id: 'admin-1',
            name: 'Mohd Umar',
            email: 'admin@salmanenterprises.in',
            password: 'Admin@123',
            role: 'Admin',
            salaryPerDay: 0,
            active: true
          }
        ],
        shops: [],
        attendance: [],
        visits: [],
        currentUserId: null,
        activeTab: 'attendance',
        loginError: '',
        statusBanner: ''
      };
    }

    // Cleans up old/odd data (e.g. removed inventory section, shops without a salesman)
    function normalizeState(s) {
      const out = { ...defaultState(), ...s };
      delete out.inventory;
      delete out.invoices;
      if (!ALL_TABS.includes(out.activeTab)) out.activeTab = 'attendance';
      out.users = Array.isArray(out.users) && out.users.length ? out.users : defaultState().users;
      out.attendance = Array.isArray(out.attendance) ? out.attendance : [];
      out.visits = Array.isArray(out.visits) ? out.visits : [];
      out.shops = (Array.isArray(out.shops) ? out.shops : []).map((sh) => ({
        id: sh.id,
        name: sh.name || 'Unnamed Shop',
        area: sh.area || '',
        lat: sh.lat === null || sh.lat === undefined || sh.lat === '' ? null : Number(sh.lat),
        lng: sh.lng === null || sh.lng === undefined || sh.lng === '' ? null : Number(sh.lng),
        salesmanId: sh.salesmanId || ''
      }));
      return out;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        return normalizeState(JSON.parse(raw));
      } catch (_) {
        return defaultState();
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
      render();
      if (typeof window.__pushErpCloudState === 'function') {
        window.__pushErpCloudState();
      }
    }

    function currentUser() {
      return state.users.find((u) => u.id === state.currentUserId && u.active) || null;
    }

    function salesmanName(id) {
      const u = state.users.find((x) => x.id === id);
      return u ? u.name : 'Unassigned';
    }

    function getLiveGps() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('GPS is not supported on this browser/device.'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolve({
              lat: Number(pos.coords.latitude.toFixed(6)),
              lng: Number(pos.coords.longitude.toFixed(6)),
              accuracy: Math.round(pos.coords.accuracy || 10)
            });
          },
          (err) => {
            reject(new Error(err.message || 'Location permission denied. Please allow GPS access.'));
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
        );
      });
    }

    function dateKeyOf(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function todayKey() {
      return dateKeyOf(new Date());
    }

    function localDateKey(iso) {
      return dateKeyOf(new Date(iso));
    }

    function formatDuration(inIso, outIso) {
      if (!inIso || !outIso) return 'In Progress';
      const diffMs = new Date(outIso).getTime() - new Date(inIso).getTime();
      if (diffMs <= 0) return '0h 0m';
      const totalMins = Math.floor(diffMs / 60000);
      const hrs = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      return `${hrs}h ${mins}m`;
    }

    function downloadCsv(filename, headers, rows) {
      const csvContent = [headers, ...rows]
        .map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\n');
      const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportAttendanceCsv() {
      const headers = [
        'Date', 'Worker Name', 'Email', 'Check-In Time', 'Check-In Distance (m)',
        'Check-Out Time', 'Check-Out Distance (m)', 'Shift Duration', 'Daily Rate (INR)', 'Status'
      ];
      const rows = state.attendance.map((rec) => {
        const user = state.users.find((u) => u.id === rec.userId) || {};
        const dur = formatDuration(rec.checkInAt, rec.checkOutAt);
        const status = rec.checkInAt && rec.checkOutAt ? 'Full Shift Logged' : 'Check-In Only';
        return [
          rec.date,
          user.name || rec.userName || '',
          user.email || '',
          rec.checkInAt ? new Date(rec.checkInAt).toLocaleString('en-IN') : '',
          rec.checkInDistance ?? '',
          rec.checkOutAt ? new Date(rec.checkOutAt).toLocaleString('en-IN') : '',
          rec.checkOutDistance ?? '',
          dur,
          user.salaryPerDay || 0,
          status
        ];
      });
      downloadCsv(`attendance_salary_${todayKey()}.csv`, headers, rows);
    }

    // ---------- Shop report (sale & collection per shop) ----------
    function visitsVisibleTo(user) {
      return user.role === 'Admin' ? state.visits : state.visits.filter((v) => v.userId === user.id);
    }

    function visitInRange(v) {
      const d = localDateKey(v.loggedAt);
      return (!ui.from || d >= ui.from) && (!ui.to || d <= ui.to);
    }

    function buildShopReport(user) {
      const rows = new Map();
      const scopeShops = user.role === 'Admin'
        ? state.shops
        : state.shops.filter((s) => s.salesmanId === user.id);
      scopeShops.forEach((s) => {
        rows.set(s.id, { name: s.name, area: s.area, salesman: salesmanName(s.salesmanId), visits: 0, sale: 0, collection: 0 });
      });
      visitsVisibleTo(user).filter(visitInRange).forEach((v) => {
        const key = v.shopId || 'name:' + v.shopName;
        let r = rows.get(key);
        if (!r) {
          const s = state.shops.find((x) => x.id === v.shopId);
          r = {
            name: s ? s.name : v.shopName,
            area: s ? s.area : '',
            salesman: s ? salesmanName(s.salesmanId) : 'Shop removed',
            visits: 0, sale: 0, collection: 0
          };
          rows.set(key, r);
        }
        r.visits += 1;
        r.sale += Number(v.saleAmount) || 0;
        r.collection += Number(v.collectionAmount) || 0;
      });
      return [...rows.values()].sort((a, b) => b.sale - a.sale);
    }

    function exportShopReportCsv() {
      const user = currentUser();
      if (!user) return;
      const rep = buildShopReport(user);
      const headers = ['Shop', 'Area', 'Salesman (current)', 'Visits', 'Sale (INR)', 'Collection (INR)'];
      const rows = rep.map((r) => [r.name, r.area, r.salesman, r.visits, r.sale, r.collection]);
      downloadCsv(`shop_sale_collection_${todayKey()}.csv`, headers, rows);
    }

    // ---------- Attendance & visit actions ----------
    async function handleCheckIn() {
      const user = currentUser();
      if (!user) return;
      try {
        const gps = await getLiveGps();
        const dist = haversineMeters(gps.lat, gps.lng, state.baseOffice.lat, state.baseOffice.lng);
        const radius = Number(state.geofenceRadiusMeters) || 50;
        if (dist > radius) {
          state.statusBanner = `Check-In Blocked: You are ${dist}m away from Base Office (allowed within ${radius}m).`;
          render();
          return;
        }
        const date = todayKey();
        const existing = state.attendance.find((a) => a.userId === user.id && a.date === date);
        if (existing) {
          state.statusBanner = `Already checked in today at ${new Date(existing.checkInAt).toLocaleTimeString('en-IN')}.`;
          render();
          return;
        }
        state.attendance.unshift({
          id: 'att-' + Date.now(),
          userId: user.id,
          userName: user.name,
          date,
          checkInAt: new Date().toISOString(),
          checkInLat: gps.lat,
          checkInLng: gps.lng,
          checkInDistance: dist,
          checkOutAt: null,
          checkOutDistance: null
        });
        state.statusBanner = `Office Check-In recorded (${dist}m from Base Office). You can now visit your shops.`;
        saveState();
      } catch (err) {
        state.statusBanner = err.message;
        render();
      }
    }

    async function handleCheckOut() {
      const user = currentUser();
      if (!user) return;
      const date = todayKey();
      const rec = state.attendance.find((a) => a.userId === user.id && a.date === date);
      if (!rec) {
        state.statusBanner = 'Please complete Base Office Check-In first before checking out.';
        render();
        return;
      }
      if (rec.checkOutAt) {
        state.statusBanner = 'You have already checked out from the Base Office today.';
        render();
        return;
      }
      try {
        const gps = await getLiveGps();
        const dist = haversineMeters(gps.lat, gps.lng, state.baseOffice.lat, state.baseOffice.lng);
        const radius = Number(state.geofenceRadiusMeters) || 50;
        if (dist > radius) {
          state.statusBanner = `Check-Out Locked: Return within ${radius}m of Base Office first (currently ${dist}m away).`;
          render();
          return;
        }
        rec.checkOutAt = new Date().toISOString();
        rec.checkOutDistance = dist;
        state.statusBanner = `Office Check-Out recorded (${dist}m from Base Office). Total shift: ${formatDuration(rec.checkInAt, rec.checkOutAt)}.`;
        saveState();
      } catch (err) {
        state.statusBanner = err.message;
        render();
      }
    }

    async function handleLogVisit(e) {
      e.preventDefault();
      const user = currentUser();
      if (!user) return;
      const shopId = document.getElementById('visitShopId').value;
      const shop = state.shops.find((s) => s.id === shopId);
      if (!shop) {
        state.statusBanner = 'Please select a shop first.';
        render();
        return;
      }
      if (user.role !== 'Admin' && shop.salesmanId !== user.id) {
        state.statusBanner = 'This shop is not mapped to you.';
        render();
        return;
      }
      const saleAmount = Math.max(0, Number(document.getElementById('visitSale').value) || 0);
      const collectionAmount = Math.max(0, Number(document.getElementById('visitCollection').value) || 0);
      const notes = document.getElementById('visitNotes').value.trim();
      try {
        const gps = await getLiveGps();
        const hasPin = shop.lat !== null && shop.lng !== null && !isNaN(shop.lat) && !isNaN(shop.lng);
        const dist = hasPin ? haversineMeters(gps.lat, gps.lng, shop.lat, shop.lng) : null;
        state.visits.unshift({
          id: 'vis-' + Date.now(),
          userId: user.id,
          userName: user.name,
          shopId: shop.id,
          shopName: shop.name,
          saleAmount,
          collectionAmount,
          notes,
          lat: gps.lat,
          lng: gps.lng,
          distanceToShop: dist,
          loggedAt: new Date().toISOString()
        });
        state.statusBanner = `Visit logged at ${shop.name}: Sale ${inr(saleAmount)}, Collection ${inr(collectionAmount)}.`;
        saveState();
      } catch (err) {
        state.statusBanner = err.message;
        render();
      }
    }

    // ---------- Screens ----------
    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
          <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
            <div class="mb-6">
              <p class="text-xs font-semibold uppercase tracking-wider text-blue-700">Staff Portal</p>
              <h1 class="text-2xl font-bold text-slate-900 mt-1">${esc(state.brandName)}</h1>
              <p class="text-sm text-slate-500 mt-1">${esc(state.tagline)}</p>
            </div>

            ${state.loginError ? `
              <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700">
                ${esc(state.loginError)}
              </div>
            ` : ''}

            <form id="loginForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input id="loginEmail" type="email" required placeholder="name@salmanenterprises.in"
                  class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600" />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input id="loginPassword" type="password" required placeholder="••••••••"
                  class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600" />
              </div>
              <button type="submit"
                class="w-full py-2.5 px-4 rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold transition cursor-pointer">
                Sign In
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function renderDashboard(user) {
      const isAdmin = user.role === 'Admin';
      let tab = ALL_TABS.includes(state.activeTab) ? state.activeTab : 'attendance';
      if (!isAdmin && ADMIN_TABS.includes(tab)) tab = 'attendance';

      const todayRec = state.attendance.find((a) => a.userId === user.id && a.date === todayKey());
      const visibleAttendance = isAdmin
        ? state.attendance
        : state.attendance.filter((a) => a.userId === user.id);
      const visibleVisits = visitsVisibleTo(user);
      const myShops = isAdmin ? state.shops : state.shops.filter((s) => s.salesmanId === user.id);
      const assignableUsers = state.users.filter((u) => u.active);

      const navBtn = (id, label) => `
        <button data-tab="${id}" class="nav-btn w-full text-left px-3.5 py-2.5 rounded-lg font-medium ${tab === id ? 'bg-blue-700 text-white' : 'text-slate-300 hover:bg-slate-800'}">
          ${label}
        </button>`;

      // report numbers
      const report = tab === 'report' ? buildShopReport(user) : [];
      const totalSale = report.reduce((t, r) => t + r.sale, 0);
      const totalCollection = report.reduce((t, r) => t + r.collection, 0);
      const totalVisits = report.reduce((t, r) => t + r.visits, 0);

      return `
        <div class="min-h-screen flex flex-col md:flex-row">
          <aside class="no-print w-full md:w-64 bg-slate-900 text-white p-5 flex flex-col justify-between">
            <div>
              <div class="pb-5 border-b border-slate-800">
                <p class="text-xs uppercase tracking-wider text-blue-400 font-semibold">Live ERP</p>
                <h2 class="text-lg font-bold leading-snug mt-1">${esc(state.brandName)}</h2>
                <p class="text-xs text-slate-400 mt-1">${esc(user.name)} (${esc(user.role)})</p>
              </div>

              <nav class="mt-5 space-y-1.5 text-sm">
                ${navBtn('attendance', 'Attendance &amp; Shop Visits')}
                ${navBtn('report', 'Shop Sale &amp; Collection')}
                ${isAdmin ? `
                  ${navBtn('users', '1. Manage Staff &amp; Logins')}
                  ${navBtn('shops', '2. Shops &amp; Salesman Mapping')}
                  ${navBtn('location', 'Base Office GPS')}
                ` : ''}
              </nav>
            </div>

            <div class="pt-6 border-t border-slate-800 space-y-2">
              <button id="exportCsvBtn" class="w-full py-2 px-3 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold cursor-pointer">
                Export Attendance CSV (Salary)
              </button>
              <button id="logoutBtn" class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold cursor-pointer">
                Sign Out
              </button>
            </div>
          </aside>

          <main class="flex-1 p-5 md:p-8 space-y-6">
            ${state.statusBanner ? `
              <div class="no-print p-4 rounded-xl bg-blue-50 border border-blue-200 text-sm text-blue-900 flex items-center justify-between gap-4">
                <span>${esc(state.statusBanner)}</span>
                <button id="clearBannerBtn" class="text-xs font-semibold underline cursor-pointer">Dismiss</button>
              </div>
            ` : ''}

            ${tab === 'attendance' ? `
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                  <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-slate-900">Office Attendance (${state.geofenceRadiusMeters}m)</h3>
                    <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 font-medium">${todayKey()}</span>
                  </div>
                  <p class="text-sm text-slate-600">
                    Office: <strong>${esc(state.baseOffice.name)}</strong>.
                    Check-in and check-out work only within ${state.geofenceRadiusMeters}m of the office.
                  </p>
                  <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-sm space-y-1">
                    <div><strong>Today's Check-In:</strong> ${todayRec?.checkInAt ? new Date(todayRec.checkInAt).toLocaleTimeString('en-IN') + ` (${todayRec.checkInDistance}m)` : 'Not yet marked'}</div>
                    <div><strong>Today's Check-Out:</strong> ${todayRec?.checkOutAt ? new Date(todayRec.checkOutAt).toLocaleTimeString('en-IN') + ` (${todayRec.checkOutDistance}m)` : 'Pending'}</div>
                    <div><strong>Shift Duration:</strong> ${todayRec ? formatDuration(todayRec.checkInAt, todayRec.checkOutAt) : '0h 0m'}</div>
                  </div>
                  <div class="flex flex-wrap gap-3">
                    <button id="checkInBtn" class="px-4 py-2.5 rounded-lg bg-blue-700 hover:bg-blue-800 text-white text-sm font-semibold cursor-pointer">
                      Office Check-In
                    </button>
                    <button id="checkOutBtn" class="px-4 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold cursor-pointer">
                      Office Check-Out
                    </button>
                  </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                  <h3 class="text-lg font-bold text-slate-900">Log Shop Visit</h3>
                  ${myShops.length ? `
                    <form id="visitForm" class="space-y-3">
                      <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Shop ${isAdmin ? '(all shops)' : '(your shops)'}</label>
                        <select id="visitShopId" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                          ${myShops.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}${s.area ? ' — ' + esc(s.area) : ''}</option>`).join('')}
                        </select>
                      </div>
                      <div class="grid grid-cols-2 gap-3">
                        <div>
                          <label class="block text-sm font-medium text-slate-700 mb-1">Sale Today (₹)</label>
                          <input id="visitSale" type="number" min="0" step="any" placeholder="0" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
                        </div>
                        <div>
                          <label class="block text-sm font-medium text-slate-700 mb-1">Collection (₹)</label>
                          <input id="visitCollection" type="number" min="0" step="any" placeholder="0" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
                        </div>
                      </div>
                      <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Notes (optional)</label>
                        <input id="visitNotes" type="text" placeholder="e.g., 5x phone order, cheque next week"
                          class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
                      </div>
                      <button type="submit" class="px-4 py-2.5 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold cursor-pointer">
                        Capture GPS &amp; Save Visit
                      </button>
                    </form>
                  ` : `
                    <p class="text-sm text-slate-500">
                      ${isAdmin ? 'No shops created yet. Go to "2. Shops &amp; Salesman Mapping" to add shops.' : 'No shop is mapped to you yet. Please ask the admin.'}
                    </p>
                  `}
                </div>
              </div>

              ${!isAdmin ? `
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                  <h3 class="text-lg font-bold text-slate-900 mb-3">My Shops (${myShops.length})</h3>
                  <div class="flex flex-wrap gap-2 text-sm">
                    ${myShops.length ? myShops.map((s) => `
                      <span class="px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200">${esc(s.name)}${s.area ? ' · ' + esc(s.area) : ''}</span>
                    `).join('') : '<span class="text-slate-400">None</span>'}
                  </div>
                </div>
              ` : ''}

              <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <h3 class="text-lg font-bold text-slate-900 mb-3">Shop Visit Log</h3>
                <div class="space-y-2 text-sm">
                  ${visibleVisits.length ? visibleVisits.map((v) => `
                    <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 flex flex-wrap justify-between gap-2">

            salesmanId
          });
          state.statusBanner = `Shop "${name}" saved and mapped to ${salesmanName(salesmanId)}.`;
          saveState();
        });
      }

      document.querySelectorAll('.shop-assign-select').forEach((sel) => {
        sel.addEventListener('change', () => {
          const sid = sel.getAttribute('data-shop-assign');
          const shop = state.shops.find((s) => s.id === sid);
          if (!shop) return;
          shop.salesmanId = sel.value;
          state.statusBanner = `"${shop.name}" is now mapped to ${salesmanName(shop.salesmanId)}.`;
          saveState();
        });
      });

      document.querySelectorAll('.remove-shop-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const sid = btn.getAttribute('data-remove-shop');
          const shop = state.shops.find((s) => s.id === sid);
          if (!shop || !window.confirm(`Remove shop "${shop.name}"? Past visit records are kept.`)) return;
          state.shops = state.shops.filter((s) => s.id !== sid);
          state.statusBanner = `Removed shop "${shop.name}".`;
          saveState();
        });
      });
    }

    render();
  </script>

  <script>
    (function enableMongoCloudSync() {
      const SYNC_INTERVAL_MS = 12000;
      const UI_KEYS = ['currentUserId', 'activeTab', 'loginError', 'statusBanner'];
      let busy = false;
      let again = false;

      function clean(s) {
        const c = { ...s };
        UI_KEYS.forEach((k) => delete c[k]);
        return c;
      }

      // JSON text with sorted keys, so two equal states always compare equal
      function stable(v) {
        if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
        if (v && typeof v === 'object') {
          return '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
        }
        return JSON.stringify(v === undefined ? null : v);
      }

      function unionById(localList, cloudList, timeKey, preferCloud) {
        const map = new Map();
        (cloudList || []).forEach((r) => map.set(r.id, r));
        (localList || []).forEach((r) => {
          const c = map.get(r.id);
          map.set(r.id, c && preferCloud(r, c) ? c : r);
        });
        return [...map.values()].sort((a, b) => String(b[timeKey] || '').localeCompare(String(a[timeKey] || '')));
      }

      // Combine this device's data with the cloud's data so nobody's records get lost.
      // Admin's settings (staff, shops, mapping, office pin) win when an Admin is logged in here.
      function merge(local, cloud) {
        if (!cloud) return local;
        const me = currentUser();
        const isAdmin = !!(me && me.role === 'Admin');
        const base = isAdmin ? clean(local) : clean(cloud);
        const merged = {
          ...base,
          attendance: unionById(local.attendance, cloud.attendance, 'checkInAt',
            (l, c) => !!c.checkOutAt && !l.checkOutAt),
          visits: unionById(local.visits, cloud.visits, 'loggedAt', () => false)
        };
        UI_KEYS.forEach((k) => { merged[k] = local[k]; });
        return normalizeState(merged);
      }

      async function fetchCloud() {
        try {
          const res = await fetch('/api/state', { cache: 'no-store' });
          if (!res.ok) return undefined;
          const payload = await res.json();
          return payload && payload.state ? payload.state : null;
        } catch (_) {
          return undefined; // network problem: do not touch anything
        }
      }

      async function syncOnce() {
        if (busy) { again = true; return; }
        busy = true;
        try {
          const cloud = await fetchCloud();
          if (cloud === undefined) return;

          const merged = merge(state, cloud);
          const mergedStable = stable(clean(merged));

          if (mergedStable !== stable(clean(state))) {
            state = merged;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
            const tag = document.activeElement && document.activeElement.tagName;
            const typing = ['INPUT', 'SELECT', 'TEXTAREA'].includes(tag);
            if (!typing) render();
          }

          const cloudStable = cloud ? stable(clean(normalizeState(cloud))) : '';
          if (mergedStable !== cloudStable) {
            await fetch('/api/state', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ state: clean(merged) })
            });
          }
        } catch (_) {
        } finally {
          busy = false;
          if (again) { again = false; setTimeout(syncOnce, 300); }
        }
      }

      window.__pushErpCloudState = syncOnce;

      window.addEventListener('load', () => {
        syncOnce();
        setInterval(syncOnce, SYNC_INTERVAL_MS);
      });
    })();
  </script>
</body>
</html>
