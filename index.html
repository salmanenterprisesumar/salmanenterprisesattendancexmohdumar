<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1d4ed8" />
  <!-- Embedded "S" Logo Icon for Salman Enterprises -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231d4ed8'/%3E%3Cstop offset='100%25' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='69' font-family='system-ui,-apple-system,sans-serif' font-size='62' font-weight='800' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231d4ed8'/%3E%3Ctext x='50' y='69' font-family='system-ui,sans-serif' font-size='62' font-weight='800' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <title>Mohd Umar × Salman Enterprises — Staff, Shops &amp; Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes checkStroke {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    .animate-pop { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-check {
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: checkStroke 0.45s 0.12s ease-out forwards;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased selection:bg-blue-100">
  <div id="app"></div>

  <script>
    const STORAGE_KEY = 'mohd_umar_salman_enterprises_erp_v3';
    const LEGACY_KEYS = ['mohd_umar_salman_enterprises_erp_v2'];
    const ADMIN_TABS = ['users', 'shops', 'location', 'months'];
    const ALL_TABS = ['dashboard', 'attendance', 'report', ...ADMIN_TABS];
    const OFFICE_END_HOUR = 19, OFFICE_END_MIN = 30; // 7:30 PM auto checkout

    // Browser-only UI state (never overwrites cloud state)
    const ui = {
      from: '',
      to: '',
      month: dateKeyOf(new Date()).slice(0, 7),
      today: dateKeyOf(new Date()),
      mobileMenuOpen: false,
      gpsBusy: false,
      pendingPhoto: null, // Compressed base64 selfie for check-in
      popup: null,        // { title, subtitle, detail, photo }
      previewPhoto: null  // Full-screen photo URL for viewing
    };

    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function inr(n) {
      return '₹' + Number(n || 0).toLocaleString('en-IN');
    }

    function brandLogoHtml(size = 'md') {
      const dims = size === 'lg' ? 'w-12 h-12 text-2xl rounded-2xl' : 'w-9 h-9 text-lg rounded-xl';
      return `<div class="${dims} bg-gradient-to-br from-blue-600 to-indigo-600 text-white font-black flex items-center justify-center shadow-md shrink-0 select-none tracking-tight">S</div>`;
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function defaultState() {
      return {
        brandName: 'Salman Enterprises',
        subBrand: 'Mohd Umar × Salman Enterprises',
        tagline: 'Staff Attendance, Shop Visits, Sales & Collection',
        geofenceRadiusMeters: 50,
        baseOffice: {
          name: 'Base Office — Salman Enterprises',
          address: 'Prayagraj, Uttar Pradesh',
          lat: 25.4358,
          lng: 81.8463
        },
        users: [
          {
            id: 'admin-1',
            name: 'Mohd Umar',
            email: 'admin@salmanenterprises.in',
            password: 'Admin@123',
            role: 'Admin',
            salaryPerDay: 0,
            targetSale: 0,
            targetCollection: 0,
            active: true
          }
        ],
        configAt: 0,
        purges: [],
        shops: [],
        attendance: [],
        visits: [],
        currentUserId: null,
        activeTab: 'attendance',
        loginError: '',
        statusBanner: ''
      };
    }

    // Selective purge support: type can be 'all' | 'attendance' | 'visits'
    function isPurged(purges, iso, recordType) {
      const t = new Date(iso).getTime();
      if (isNaN(t)) return false;
      const m = monthOfIso(iso);
      return (purges || []).some((p) => {
        if (p.month !== m) return false;
        const pType = p.type || 'all';
        if (pType !== 'all' && pType !== recordType) return false;
        return t <= Number(p.at);
      });
    }

    function applyPurges(s) {
      if (!s.purges || !s.purges.length) return;
      s.attendance = s.attendance.filter((a) => !isPurged(s.purges, a.checkInAt || a.date, 'attendance'));
      s.visits = s.visits.filter((v) => !isPurged(s.purges, v.loggedAt, 'visits'));
    }

    function unionPurges(a, b) {
      const m = new Map();
      [...(a || []), ...(b || [])].forEach((p) => {
        const type = p.type || 'all';
        const key = `${p.month}:${type}`;
        const c = m.get(key);
        if (!c || Number(p.at) > Number(c.at)) {
          m.set(key, { month: p.month, type, at: Number(p.at) });
        }
      });
      return [...m.values()];
    }

    function normalizeState(s) {
      const out = { ...defaultState(), ...s };
      delete out.inventory;
      delete out.invoices;
      if (!ALL_TABS.includes(out.activeTab)) out.activeTab = 'attendance';
      out.users = Array.isArray(out.users) && out.users.length ? out.users : defaultState().users;
      out.attendance = Array.isArray(out.attendance) ? out.attendance : [];
      out.visits = Array.isArray(out.visits) ? out.visits : [];
      out.purges = Array.isArray(out.purges) ? out.purges : [];
      out.users = out.users.map((u) => ({
        ...u,
        active: u.active !== false,
        targetSale: Number(u.targetSale) || 0,
        targetCollection: Number(u.targetCollection) || 0
      }));
      applyPurges(out);
      out.shops = (Array.isArray(out.shops) ? out.shops : []).map((sh) => ({
        id: sh.id,
        name: sh.name || 'Unnamed Shop',
        area: sh.area || '',
        lat: sh.lat === null || sh.lat === undefined || sh.lat === '' ? null : Number(sh.lat),
        lng: sh.lng === null || sh.lng === undefined || sh.lng === '' ? null : Number(sh.lng),
        salesmanId: sh.salesmanId || ''
      }));
      return out;
    }

    function loadState() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (const oldKey of LEGACY_KEYS) {
            raw = localStorage.getItem(oldKey);
            if (raw) break;
          }
        }
        if (!raw) return defaultState();
        return normalizeState(JSON.parse(raw));
      } catch (_) {
        return defaultState();
      }
    }

    let state = loadState();
    runAutoCheckout();

    // Saves session/UI changes locally without triggering unnecessary cloud pushes
    function saveLocalOnly() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
      render();
    }

    // Saves data & pushes to cloud
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
      render();
      if (typeof window.__pushErpCloudState === 'function') {
        window.__pushErpCloudState();
      }
    }

    function saveConfig() {
      state.configAt = Date.now();
      saveState();
    }

    function syncBadge(lightBg = false) {
      const t = window.__syncText || 'Cloud: connecting...';
      const bad = window.__syncBad;
      const cls = bad
        ? (lightBg ? 'text-red-600' : 'text-red-400')
        : (lightBg ? 'text-emerald-700' : 'text-emerald-400');
      return `<p id="syncStatus" class="text-xs ${cls} break-words">${esc(t)}</p>`;
    }

    function currentUser() {
      if (!state.currentUserId) return null;
      return state.users.find((u) => u.id === state.currentUserId && u.active !== false) || null;
    }

    function isAdminUser() {
      const u = currentUser();
      return !!u && u.role === 'Admin';
    }

    function salesmanName(id) {
      const u = state.users.find((x) => x.id === id);
      return u ? u.name : 'Unassigned';
    }

    function getLiveGps() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('GPS is not supported on this browser/device.'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolve({
              lat: Number(pos.coords.latitude.toFixed(6)),
              lng: Number(pos.coords.longitude.toFixed(6)),
              accuracy: Math.round(pos.coords.accuracy || 10)
            });
          },
          (err) => {
            reject(new Error(err.message || 'Location permission denied. Please enable GPS & allow location access.'));
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      });
    }

    // Compresses selfie image to lightweight JPEG (~35-60KB) so cloud sync stays fast
    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        if (!file) { reject(new Error('No image selected.')); return; }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Failed to read photo.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Invalid image file.'));
          img.onload = () => {
            const maxDim = 640;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.68));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function dateKeyOf(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function todayKey() {
      return dateKeyOf(new Date());
    }

    function localDateKey(iso) {
      return dateKeyOf(new Date(iso));
    }

    function formatDuration(inIso, outIso) {
      if (!inIso || !outIso) return 'In Progress';
      const diffMs = new Date(outIso).getTime() - new Date(inIso).getTime();
      if (diffMs <= 0) return '0h 0m';
      const totalMins = Math.floor(diffMs / 60000);
      const hrs = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      return `${hrs}h ${mins}m`;
    }

    // ---------- Admin-Only CSV Downloads ----------
    function downloadCsv(filename, headers, rows) {
      if (!isAdminUser()) {
        state.statusBanner = 'Access Denied: Only Admin can download CSV files.';
        render();
        return;
      }
      const csvContent = [headers, ...rows]
        .map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\n');
      const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportAttendanceCsv(month) {
      if (!isAdminUser()) return;
      month = typeof month === 'string' ? month : '';
      const headers = [
        'Date', 'Worker Name', 'Email', 'Check-In Time', 'Check-In Distance (m)',
        'Check-Out Time', 'Check-Out Distance (m)', 'Shift Duration', 'Daily Rate (INR)', 'Status',
        'Photo Attached', 'Check-In Lat', 'Check-In Lng', 'Check-Out Lat', 'Check-Out Lng', 'Auto Check-Out'
      ];
      const rows = attList(month).map((rec) => {
        const user = state.users.find((u) => u.id === rec.userId) || {};
        const dur = formatDuration(rec.checkInAt, rec.checkOutAt);
        const status = rec.autoCheckout ? 'Auto Check-Out 7:30 PM' : rec.checkInAt && rec.checkOutAt ? 'Full Shift Logged' : 'Check-In Only';
        return [
          rec.date,
          user.name || rec.userName || '',
          user.email || '',
          rec.checkInAt ? new Date(rec.checkInAt).toLocaleString('en-IN') : '',
          rec.checkInDistance ?? '',
          rec.checkOutAt ? new Date(rec.checkOutAt).toLocaleString('en-IN') : '',
          rec.checkOutDistance ?? '',
          dur,
          user.salaryPerDay || 0,
          status,
          rec.checkInPhoto ? 'Yes' : 'No',
          rec.checkInLat ?? '', rec.checkInLng ?? '', rec.checkOutLat ?? '', rec.checkOutLng ?? '',
          rec.autoCheckout ? 'Yes' : ''
        ];
      });
      downloadCsv(`attendance_salary_${month || todayKey()}.csv`, headers, rows);
    }

    function visitsVisibleTo(user) {
      return user.role === 'Admin' ? state.visits : state.visits.filter((v) => v.userId === user.id);
    }

    function visitInRange(v) {
      const d = localDateKey(v.loggedAt);
      return (!ui.from || d >= ui.from) && (!ui.to || d <= ui.to);
    }

    function buildShopReport(user) {
      const rows = new Map();
      const scopeShops = user.role === 'Admin'
        ? state.shops
        : state.shops.filter((s) => s.salesmanId === user.id);
      scopeShops.forEach((s) => {
        rows.set(s.id, { name: s.name, area: s.area, salesman: salesmanName(s.salesmanId), visits: 0, sale: 0, collection: 0 });
      });
      visitsVisibleTo(user).filter(visitInRange).forEach((v) => {
        const key = v.shopId || 'name:' + v.shopName;
        let r = rows.get(key);
        if (!r) {
          const s = state.shops.find((x) => x.id === v.shopId);
          r = {
            name: s ? s.name : v.shopName,
            area: s ? s.area : '',
            salesman: s ? salesmanName(s.salesmanId) : 'Shop removed',
            visits: 0, sale: 0, collection: 0
          };
          rows.set(key, r);
        }
        r.visits += 1;
        r.sale += Number(v.saleAmount) || 0;
        r.collection += Number(v.collectionAmount) || 0;
      });
      return [...rows.values()].sort((a, b) => b.sale - a.sale);
    }

    function exportShopReportCsv() {
      const user = currentUser();
      if (!user || user.role !== 'Admin') return;
      const rep = buildShopReport(user);
      const headers = ['Shop', 'Area', 'Salesman (current)', 'Visits', 'Sale (INR)', 'Collection (INR)'];
      const rows = rep.map((r) => [r.name, r.area, r.salesman, r.visits, r.sale, r.collection]);
      downloadCsv(`shop_sale_collection_${todayKey()}.csv`, headers, rows);
    }

    // ---------- Attendance & Check-In Image Actions ----------
    async function handleCheckIn() {
      const user = currentUser();
      if (!user || ui.gpsBusy) return;

      const nowT = new Date();
      if (nowT.getHours() * 60 + nowT.getMinutes() >= OFFICE_END_HOUR * 60 + OFFICE_END_MIN) {
        state.statusBanner = 'Office time has ended (Check-In is closed after 7:30 PM).';
        render();
        return;
      }

      const date = todayKey();
      const existing = state.attendance.find((a) => a.userId === user.id && a.date === date);
      if (existing) {
        state.statusBanner = `Already checked in today at ${new Date(existing.checkInAt).toLocaleTimeString('en-IN')}.`;
        render();
        return;
      }

      if (!ui.pendingPhoto) {
        state.statusBanner = 'Please capture or upload your Office Check-In Photo first.';
        render();
        return;
      }

      ui.gpsBusy = true;
      render();

      try {
        const gps = await getLiveGps();
        const dist = haversineMeters(gps.lat, gps.lng, state.baseOffice.lat, state.baseOffice.lng);
        const radius = Number(state.geofenceRadiusMeters) || 50;
        if (dist > radius) {
          ui.gpsBusy = false;
          state.statusBanner = `Check-In Blocked: You are ${dist}m away from Base Office (allowed within ${radius}m).`;
          render();
          return;
        }

        const nowIso = new Date().toISOString();
        const photoData = ui.pendingPhoto;
        state.attendance.unshift({
          id: 'att-' + Date.now(),
          userId: user.id,
          userName: user.name,
          date,
          checkInAt: nowIso,
          checkInLat: gps.lat,
          checkInLng: gps.lng,
          checkInDistance: dist,
          checkInPhoto: photoData,
          checkOutAt: null,
          checkOutDistance: null
        });

        ui.pendingPhoto = null;
        ui.gpsBusy = false;
        ui.popup = {
          title: 'Office Check-In Successful!',
          subtitle: `${user.name} • ${new Date(nowIso).toLocaleTimeString('en-IN')}`,
          detail: `Verified within ${dist}m of ${state.baseOffice.name}. You can now log shop visits.`,
          photo: photoData
        };
        state.statusBanner = `Office Check-In recorded (${dist}m from Base Office).`;
        saveState();
      } catch (err) {
        ui.gpsBusy = false;
        state.statusBanner = err.message;
        render();
      }
    }

    async function handleCheckOut() {
      const user = currentUser();
      if (!user || ui.gpsBusy) return;
      const date = todayKey();
      const rec = state.attendance.find((a) => a.userId === user.id && a.date === date);
      if (!rec) {
        state.statusBanner = 'Please complete Base Office Check-In first before checking out.';
        render();
        return;
      }
      if (rec.checkOutAt) {
        state.statusBanner = 'You have already checked out from the Base Office today.';
        render();
        return;
      }

      ui.gpsBusy = true;
      render();

      try {
        const gps = await getLiveGps();
        const dist = haversineMeters(gps.lat, gps.lng, state.baseOffice.lat, state.baseOffice.lng);
        const radius = Number(state.geofenceRadiusMeters) || 50;
        if (dist > radius) {
          ui.gpsBusy = false;
          state.statusBanner = `Check-Out Locked: Return within ${radius}m of Base Office first (currently ${dist}m away).`;
          render();
          return;
        }
        rec.checkOutAt = new Date().toISOString();
        rec.checkOutDistance = dist;
        rec.checkOutLat = gps.lat;
        rec.checkOutLng = gps.lng;
        ui.gpsBusy = false;
        ui.popup = {
          title: 'Office Check-Out Done!',
          subtitle: `${user.name} • ${new Date(rec.checkOutAt).toLocaleTimeString('en-IN')}`,
          detail: `Total shift duration: ${formatDuration(rec.checkInAt, rec.checkOutAt)} (${dist}m from office).`,
          photo: null
        };
        state.statusBanner = `Office Check-Out recorded (${dist}m from Base Office).`;
        saveState();
      } catch (err) {
        ui.gpsBusy = false;
        state.statusBanner = err.message;
        render();
      }
    }

    function deleteAttendancePhoto(attId) {
      if (!isAdminUser()) return;
      const rec = state.attendance.find((a) => a.id === attId);
      if (!rec || !rec.checkInPhoto) return;
      if (!window.confirm(`Delete check-in photo for ${rec.userName} (${rec.date})? Attendance time will be kept.`)) return;
      delete rec.checkInPhoto;
      rec.photoDeletedAt = Date.now();
      state.statusBanner = `Check-in photo deleted for ${rec.userName} (${rec.date}).`;
      saveState();
    }

    async function handleLogVisit(e) {
      e.preventDefault();
      const user = currentUser();
      if (!user || ui.gpsBusy) return;
      const shopId = document.getElementById('visitShopId').value;
      const shop = state.shops.find((s) => s.id === shopId);
      if (!shop) {
        state.statusBanner = 'Please select a shop first.';
        render();
        return;
      }
      if (user.role !== 'Admin' && shop.salesmanId !== user.id) {
        state.statusBanner = 'This shop is not mapped to you.';
        render();
        return;
      }
      const saleAmount = Math.max(0, Number(document.getElementById('visitSale').value) || 0);
      const collectionAmount = Math.max(0, Number(document.getElementById('visitCollection').value) || 0);
      const notes = document.getElementById('visitNotes').value.trim();

      ui.gpsBusy = true;
      render();

      try {
        const gps = await getLiveGps();
        const hasPin = shop.lat !== null && shop.lng !== null && !isNaN(shop.lat) && !isNaN(shop.lng);
        const dist = hasPin ? haversineMeters(gps.lat, gps.lng, shop.lat, shop.lng) : null;
        state.visits.unshift({
          id: 'vis-' + Date.now(),
          userId: user.id,
          userName: user.name,
          shopId: shop.id,
          shopName: shop.name,
          saleAmount,
          collectionAmount,
          notes,
          lat: gps.lat,
          lng: gps.lng,
          distanceToShop: dist,
          loggedAt: new Date().toISOString()
        });
        ui.gpsBusy = false;
        state.statusBanner = `Visit logged at ${shop.name}: Sale ${inr(saleAmount)}, Collection ${inr(collectionAmount)}.`;
        saveState();
      } catch (err) {
        ui.gpsBusy = false;
        state.statusBanner = err.message;
        render();
      }
    }

    // ================= Monthly target / achievement, auto checkout, selective month purge =================
    function monthOfIso(iso) {
      const d = new Date(iso);
      return isNaN(d) ? '' : dateKeyOf(d).slice(0, 7);
    }
    function monthLabel(m) {
      const [y, mo] = m.split('-').map(Number);
      return new Date(y, mo - 1, 1).toLocaleString('en-IN', { month: 'long', year: 'numeric' });
    }

    function runAutoCheckout() {
      const now = new Date();
      let changed = false;
      state.attendance.forEach((a) => {
        if (a.checkOutAt || !a.checkInAt || !a.date) return;
        const [y, m, d] = a.date.split('-').map(Number);
        const cutoff = new Date(y, m - 1, d, OFFICE_END_HOUR, OFFICE_END_MIN, 0);
        if (now >= cutoff) {
          const inAt = new Date(a.checkInAt);
          a.checkOutAt = (inAt > cutoff ? inAt : cutoff).toISOString();
          a.checkOutDistance = null;
          a.autoCheckout = true;
          changed = true;
        }
      });
      return changed;
    }

    function achievement(userId, month) {
      let sale = 0, collection = 0, visits = 0;
      state.visits.forEach((v) => {
        if (v.userId !== userId || monthOfIso(v.loggedAt) !== month) return;
        sale += Number(v.saleAmount) || 0;
        collection += Number(v.collectionAmount) || 0;
        visits += 1;
      });
      const days = state.attendance.filter((a) => a.userId === userId && String(a.date).startsWith(month)).length;
      return { sale, collection, visits, days };
    }
    function achRows(user, month) {
      const list = user.role === 'Admin'
        ? state.users.filter((u) => u.active !== false)
        : [user];
      return list
        .map((u) => ({ u, a: achievement(u.id, month) }))
        .filter((r) => user.role !== 'Admin' || r.u.role !== 'Admin' || r.a.sale || r.a.collection || r.u.targetSale || r.u.targetCollection)
        .sort((x, y) => y.a.sale - x.a.sale);
    }
    function monthsWithData() {
      const set = new Set();
      state.visits.forEach((v) => { const m = monthOfIso(v.loggedAt); if (m) set.add(m); });
      state.attendance.forEach((a) => { if (a.date) set.add(String(a.date).slice(0, 7)); });
      return [...set].sort().reverse();
    }

    function barColor(p) { return p === null ? 'bg-slate-300' : p >= 100 ? 'bg-emerald-500' : p >= 60 ? 'bg-amber-500' : 'bg-rose-500'; }
    function txtColor(p) { return p === null ? 'text-slate-500' : p >= 100 ? 'text-emerald-600' : p >= 60 ? 'text-amber-600' : 'text-rose-600'; }
    function pctOf(a, t) { return t > 0 ? Math.round((a / t) * 100) : null; }

    function progressBlock(label, ach, target) {
      const p = pctOf(ach, target);
      return `
        <div class="flex justify-between items-end text-sm">
          <span class="font-semibold text-slate-700">${label}</span>
          <span class="text-xs text-slate-500">${target > 0 ? 'Target ' + inr(target) : 'Target not set'}</span>
        </div>
        <div class="text-2xl sm:text-3xl font-extrabold mt-1">${inr(ach)} ${p !== null ? `<span class="text-base font-bold ${txtColor(p)}">${p}%</span>` : ''}</div>
        <div class="h-3.5 rounded-full bg-slate-100 mt-3 overflow-hidden"><div class="h-full ${barColor(p)} rounded-full transition-all" style="width:${p === null ? 0 : Math.min(100, p)}%"></div></div>
        ${target > 0 ? `<div class="text-xs text-slate-500 mt-1.5">${ach >= target ? '🎉 Target achieved! Extra ' + inr(ach - target) : 'Remaining ' + inr(target - ach)}</div>` : ''}`;
    }
    function miniBar(ach, target) {
      const p = pctOf(ach, target);
      return `<div class="flex items-center gap-2 mt-1"><div class="h-2 w-24 rounded-full bg-slate-100 overflow-hidden"><div class="h-full ${barColor(p)}" style="width:${p === null ? 0 : Math.min(100, p)}%"></div></div><span class="text-xs font-semibold ${txtColor(p)}">${p === null ? '—' : p + '%'}</span></div>`;
    }

    function renderAchievement(user) {
      const isAdmin = user.role === 'Admin';
      const rows = achRows(user, ui.month);
      const now = new Date();
      const isCur = ui.month === dateKeyOf(now).slice(0, 7);
      const [y, mo] = ui.month.split('-').map(Number);
      const daysLeft = isCur ? new Date(y, mo, 0).getDate() - now.getDate() + 1 : 0;
      const card = (inner) => `<div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">${inner}</div>`;

      const head = `

        </div>`;

      if (!isAdmin) {

        const need = isCur && daysLeft && u.targetSale > a.sale ? Math.ceil((u.targetSale - a.sale) / daysLeft) : 0;
        const myShops = state.shops.filter((s) => s.salesmanId === user.id).length;
        const stat = (l, v) => `<div class="p-4 rounded-xl bg-white border border-slate-200 text-center shadow-sm"><div class="text-xs text-slate-500 font-semibold">${l}</div><div class="text-xl font-bold mt-1">${v}</div></div>`;

          <div class="grid grid-cols-3 gap-3">${stat('Visits', a.visits)}${stat('Days Present', a.days)}${stat('My Shops', myShops)}</div>`;
      }

      const sum = (f) => rows.reduce((t, r) => t + f(r), 0);
      const medals = ['🥇', '🥈', '🥉'];
      const cell = (ach, t) => `<div class="font-semibold">${inr(ach)} <span class="text-xs text-slate-500 font-normal">/ ${t > 0 ? inr(t) : '—'}</span></div>${miniBar(ach, t)}`;
      return `${head}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
          ${card(progressBlock('Team Sale', sum((r) => r.a.sale), sum((r) => r.u.targetSale)))}
          ${card(progressBlock('Team Collection', sum((r) => r.a.collection), sum((r) => r.u.targetCollection)))}
        </div>
        ${card(`
          <h3 class="text-lg font-bold mb-3">Salesman-wise Achievement</h3>
          <div class="overflow-x-auto"><table class="w-full text-sm text-left border-collapse">
            <thead><tr class="border-b border-slate-200 text-slate-500">
              <th class="py-2.5 pr-4">Salesman</th><th class="py-2.5 pr-4">Sale / Target</th><th class="py-2.5 pr-4">Collection / Target</th><th class="py-2.5 pr-4 text-right">Visits</th><th class="py-2.5 text-right">Days</th>
            </tr></thead>
            <tbody>${rows.length ? rows.map((r, i) => `
              <tr class="border-b border-slate-100">
                <td class="py-3 pr-4 font-medium">${medals[i] && r.a.sale > 0 ? medals[i] + ' ' : ''}${esc(r.u.name)}<div class="text-xs text-slate-500">${esc(r.u.role)}</div></td>
                <td class="py-3 pr-4">${cell(r.a.sale, r.u.targetSale)}</td>
                <td class="py-3 pr-4">${cell(r.a.collection, r.u.targetCollection)}</td>
                <td class="py-3 pr-4 text-right">${r.a.visits}</td>
                <td class="py-3 text-right">${r.a.days}</td>
              </tr>`).join('') : '<tr><td colspan="5" class="py-6 text-center text-slate-400">No staff yet.</td></tr>'}
            </tbody></table></div>
          <p class="text-xs text-slate-500 mt-3">Set monthly targets in "1. Manage Staff &amp; Logins".</p>`)}`;
    }

    function deleteMonthSelective(m, delType) {
      if (!isAdminUser()) return;
      const vs = state.visits.filter((v) => monthOfIso(v.loggedAt) === m);
      const at = state.attendance.filter((a) => String(a.date).startsWith(m));

      const labelMap = {
        visits: `Sales & Visits Data (${vs.length} visits)`,
        attendance: `Attendance Data (${at.length} records)`,
        all: `BOTH Attendance (${at.length}) & Sales/Visits (${vs.length})`
      };
      const targetDesc = labelMap[delType] || labelMap.all;

      const typed = window.prompt(
        `You are about to permanently delete ${targetDesc} for ${monthLabel(m)}.\n` +
        `A CSV backup will be downloaded first.\n\nType DELETE to confirm:`
      );
      if (typed !== 'DELETE') return;

      if ((delType === 'visits' || delType === 'all') && vs.length) {
        exportVisitsCsv(vs, `backup_sales_visits_${m}.csv`);
      }
      if ((delType === 'attendance' || delType === 'all') && at.length) {
        exportAttendanceCsv(m);
      }

      state.purges = unionPurges(state.purges, [{ month: m, type: delType, at: Date.now() }]);
      applyPurges(state);
      state.statusBanner = `Deleted ${targetDesc} for ${monthLabel(m)} (backup CSV downloaded).`;
      saveConfig();
    }

    function exportVisitsCsv(list, filename) {
      if (!isAdminUser()) return;
      const headers = ['Date', 'Time', 'Salesman', 'Shop', 'Area', 'Sale (INR)', 'Collection (INR)', 'Notes', 'GPS Latitude', 'GPS Longitude', 'Distance from Shop Pin (m)', 'Google Maps Link'];
      const rows = list.map((v) => {

        return [localDateKey(v.loggedAt), new Date(v.loggedAt).toLocaleTimeString('en-IN'), v.userName, v.shopName, s.area || '',
          v.saleAmount, v.collectionAmount, v.notes || '', v.lat ?? '', v.lng ?? '', v.distanceToShop ?? '', mapsLink(v.lat, v.lng)];

      const rows = state.shops.map((s) => [s.name, s.area, salesmanName(s.salesmanId), s.lat ?? '', s.lng ?? '', mapsLink(s.lat, s.lng)]);
      downloadCsv(`shops_gps_${todayKey()}.csv`, headers, rows);
